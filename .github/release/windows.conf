# HomeRow's Windows installer: what it carries and starts. The installer is
# gnustep-release-actions' msi (the runtime, WinUXTheme), the same as every
# app's; see its msi.sh for each name.
NAME=HomeRow
APPS="HomeRow"
DEFAULT=HomeRow
ICON=HomeRow/Resources/HomeRow.png
SUMMARY="Practise and learn touch typing: a course, quick tests and real code to type"
# The installed app's own smoke test (HRSmokeTest.h): its outlets, a test, a
# lesson and code typed and scored, every window opened.
SMOKE="-HRSmokeTest YES"
