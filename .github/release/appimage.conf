# HomeRow's AppImage: what it carries and starts. The image is gnustep-release-actions'
# appimage (the launcher, the runtime, the fonts), the same as every app's;
# see its appimage.sh for each name.
# Not "-Linux": an .AppImage says what it is for (AppImage asks names not to).
IMAGE=HomeRow
NAME=HomeRow
APPS="HomeRow"
DEFAULT=HomeRow
# The typing surface's fixed-pitch font.
FIXED_PITCH_FONT=DejaVuSansMono
ENTRIES="Scripts/appimage/homerow.desktop=HomeRow/Resources/HomeRow.png"
REQUIRE="HomeRow.app/Resources/HomeRow.momd HomeRow.app/Resources/Layouts/qwerty.plist HomeRow.app/Resources/Lessons/gtypist/index.plist HomeRow.app/Resources/Code/index.plist HomeRow.app/Resources/CodeWindow.xib HomeRow.app/Resources/StatsWindow.xib HomeRow.app/Resources/PreferencesWindow.xib HomeRow.app/Resources/LayoutChooser.xib HomeRow.app/Resources/WelcomeWindow.xib HomeRow.app/Resources/Sounds/click/key-1.wav HomeRow.app/Resources/Languages/english"
