name: Release

# A tag is a release: `git tag v0.1.0 && git push origin v0.1.0`.
# workflow_dispatch builds the same artifacts without publishing anything,
# for rehearsing a release from any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to attach files to the release

jobs:
  ############################ Linux AppImage ############################
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev libsqlite3-dev \
            libfreetype-dev libfontconfig1-dev libxrender-dev liblcms2-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb desktop-file-utils fonts-dejavu fonts-liberation
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi

      # Same key as ci.yml, so a release normally starts from the stack the
      # last CI run on the default branch already built and tested against.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v1-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh', 'source/patches/gnustep/*.patch') }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/dependencies.sh

      - name: Fetch linuxdeploy and the AppImage runtime
        run: ./Scripts/install-linuxdeploy.sh

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      # A release that does not pass its own tests is not one.
      - name: Unit tests
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make check

      - name: Package the AppImage
        env:
          LDAI_RUNTIME_FILE: /tmp/appimage-runtime/runtime-x86_64
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/prepare-appdir.sh
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/package-appimage.sh

      - name: Smoke-test the AppImage
        run: |
          image=$(ls HomeRow-Linux-*.AppImage)
          chmod +x "$image"
          mv "$INSTALL_PATH" "$INSTALL_PATH.away"
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"
          env -u LD_LIBRARY_PATH APPIMAGE_EXTRACT_AND_RUN=1 HR_SMOKE_TEST=1 \
            timeout 120 xvfb-run -a ./"$image"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeRow-Linux-AppImage
          path: ${{ env.SRC_PATH }}/HomeRow-Linux-*.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SRC_PATH }}/HomeRow-Linux-*.AppImage

  ############################### macOS ###############################
  # Signing and notarization are optional: with no secrets configured this
  # job still produces an ad-hoc signed zip and says so. The secrets, when
  # they exist, are
  #
  #   MACOS_CERTIFICATE            base64 of a Developer ID Application .p12
  #   MACOS_CERTIFICATE_PASSWORD   its password
  #   MACOS_SIGN_IDENTITY          "Developer ID Application: Name (TEAMID)"
  #   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   (app-specific password)
  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      - name: Unit tests
        run: |
          xcodebuild -project HomeRow.xcodeproj -scheme HomeRow \
            -destination 'platform=macOS' -configuration Debug test

      - name: Build
        run: |
          xcodebuild -project HomeRow.xcodeproj -scheme HomeRow \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/release" ONLY_ACTIVE_ARCH=NO build
          echo "APP=$RUNNER_TEMP/release/Build/Products/Release/HomeRow.app" >> "$GITHUB_ENV"

      - name: Sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::MACOS_CERTIFICATE / MACOS_SIGN_IDENTITY not set; the app is ad-hoc signed and Gatekeeper will object to it"
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # --options runtime is what notarization requires.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.SIGNED == 'yes'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::warning::NOTARY_* secrets not set; signed but not notarized"
            exit 0
          fi
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/HomeRow-notarize.zip"
          # notarytool exits 0 for a submission Apple rejected, so read the
          # status, and on anything but Accepted print the log that says why
          creds=(--apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD")
          xcrun notarytool submit "$RUNNER_TEMP/HomeRow-notarize.zip" "${creds[@]}" \
            --wait --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" "${creds[@]}" || true
            echo "::error::notarization ended as $status"
            exit 1
          fi
          xcrun stapler staple "$APP"

      - name: Package
        run: |
          suffix=""; [ "$SIGNED" = "yes" ] || suffix="-unsigned"
          ditto -c -k --keepParent "$APP" "HomeRow-macOS-${APP_VERSION}${suffix}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeRow-macOS
          path: HomeRow-macOS-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HomeRow-macOS-*.zip
