name: Release

# A tag is a release: `git tag v0.1.0 && git push origin v0.1.0`.
# workflow_dispatch builds the same artifacts without publishing anything,
# for rehearsing a release from any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to attach files to the release

jobs:
  ############################ Linux AppImage ############################
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # The shared repository the gnustep-gui fixes come from, and the pin
      # that decides which of them this build gets. It is part of the cache
      # key below -- which used to hash patches/gnustep/*.patch -- so moving
      # it rebuilds the stack instead of reusing a differently-patched
      # prefix. Name a commit here to pin the build exactly.
      GNUSTEP_PATCHES_REF: 5b7cea43e828d053d72078f6dd1ebeb8785d770c
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev libsqlite3-dev libsndfile1-dev libao-dev \
            libfreetype-dev libfontconfig1-dev libxrender-dev liblcms2-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb desktop-file-utils fonts-dejavu fonts-liberation
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi

      # Same key as ci.yml, so a release normally starts from the stack the
      # last CI run on the default branch already built and tested against.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v3-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh') }}-${{ env.GNUSTEP_PATCHES_REF }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/dependencies.sh

      - name: Fetch linuxdeploy and the AppImage runtime
        run: ./Scripts/install-linuxdeploy.sh

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      # A release that does not pass its own tests is not one.
      - name: Unit tests
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make check

      - name: Package the AppImage
        env:
          LDAI_RUNTIME_FILE: /tmp/appimage-runtime/runtime-x86_64
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/prepare-appdir.sh
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/package-appimage.sh

      - name: Smoke-test the AppImage
        run: |
          image=$(ls HomeRow-Linux-*.AppImage)
          chmod +x "$image"
          mv "$INSTALL_PATH" "$INSTALL_PATH.away"
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"
          env -u LD_LIBRARY_PATH APPIMAGE_EXTRACT_AND_RUN=1 HR_SMOKE_TEST=1 \
            timeout 120 xvfb-run -a ./"$image"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeRow-Linux-AppImage
          path: ${{ env.SRC_PATH }}/HomeRow-Linux-*.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.SRC_PATH }}/HomeRow-Linux-*.AppImage

  ############################ macOS ############################
  # Ported from RDLKit's release.yml: the same environment, the same secrets,
  # the same keychain, codesign and notarytool commands, which are known to
  # work there. What differs is what is built -- one app, universal, no
  # framework or command-line tool beside it -- and that the app is tested
  # and smoke-tested before it is signed.
  #
  #   MACOS_CERTIFICATE            base64 of a Developer ID Application .p12
  #   MACOS_CERTIFICATE_PASSWORD   its password
  #   MACOS_SIGN_IDENTITY          "Developer ID Application: Name (TEAMID)"
  #   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   (app-specific password)
  macos:
    name: macOS (signed)
    runs-on: macos-15
    timeout-minutes: 45
    # The signing and notarisation secrets live in this environment, and an
    # environment's secrets are only readable by a job that names it: without
    # this line every one of them resolves to the empty string and the job
    # ships an unsigned build, saying so and passing.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      - name: Unit tests
        run: |
          xcodebuild -project HomeRow.xcodeproj -scheme HomeRow \
            -destination 'platform=macOS' -configuration Debug test

      - name: Build
        run: |
          xcodebuild -project HomeRow.xcodeproj -scheme HomeRow \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/release" ONLY_ACTIVE_ARCH=NO build
          echo "BUILT=$RUNNER_TEMP/release/Build/Products/Release" >> "$GITHUB_ENV"

      # The same check CI makes, on the very app that is about to be signed.
      - name: Smoke-test the app
        timeout-minutes: 2
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"
          export CFFIXED_USER_HOME="$HOME"
          HR_SMOKE_TEST=1 "$BUILT/HomeRow.app/Contents/MacOS/HomeRow"

      # Signing is skipped, loudly, when the certificate secrets are absent, so
      # a fork or a dry run still produces artifacts -- unsigned, and named so.
      - name: Sign
        id: sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::MACOS_CERTIFICATE or MACOS_SIGN_IDENTITY not set; shipping unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # --options runtime is what notarization requires.
          codesign --force --timestamp --options runtime --deep \
                   --sign "$IDENTITY" "$BUILT/HomeRow.app"
          codesign --verify --strict --verbose=2 "$BUILT/HomeRow.app"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # Checked here rather than in `if:`, where a step's own env block is
          # not reliably visible to its own condition -- the step would be
          # skipped whatever the secrets said, and a signed-but-unnotarized app
          # that Gatekeeper still refuses would ship from a green run.
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::warning::NOTARY_* secrets not set; signed but not notarized"
            exit 0
          fi
          ditto -c -k --keepParent "$BUILT/HomeRow.app" "$RUNNER_TEMP/HomeRow-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/HomeRow-notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$BUILT/HomeRow.app"

      - name: Package
        run: |
          suffix=""
          [ "${{ steps.sign.outputs.signed }}" = "true" ] || suffix="-unsigned"
          ditto -c -k --keepParent "$BUILT/HomeRow.app" \
            "HomeRow-macOS-${APP_VERSION}${suffix}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeRow-macOS-${{ env.APP_VERSION }}
          path: HomeRow-macOS-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HomeRow-macOS-*.zip
