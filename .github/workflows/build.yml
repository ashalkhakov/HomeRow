name: Build

# HomeRow on macOS and Linux (an AppImage), by gnustep-release-actions'
# workflows, the same as every app's: every push and pull request is built,
# tested and uploaded as artifacts; a v* tag (or a run started by hand with
# one) is also released: the Mac app signed and notarized with its Sparkle
# appcast, the AppImage with its update information, attached to the tag's
# release (a pre-release when the tag has a '-'). What is HomeRow's own is
# in .github/release/ (build, test, the image's configuration); the commits
# it builds on in .github/pins.env.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# A push and the pull request for the same branch share one run; a release
# is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: HomeRow=HomeRow
    secrets: inherit

  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      dependencies: FreeCoreData
      extra-packages: libsqlite3-dev
